<section class="mt-5">
  <table class="table table-md mt-2 w-full">
    <thead>
      <tr>
        <th>#</th>
        <th>Icono</th>
        <th>Bandera</th>
        <th>Nombre</th>
        <th>Capital</th>
        <th>Poblacion</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      @if (countries().length === 0) {
        <tr>
          <td colspan="7" class="text-center">No hay resultados</td>
        </tr>
      }

      @for (country of countries(); track country.code; let index = $index) {
        <tr>
          <td>{{ index + 1 }}</td>
          <td>
            {{ country.flag}}
          </td>
          <td>
            <img
              [src]= "country.flagSvg"
              [alt]="country.name"
              class="w-10"
            />
          </td>
          <td>
            {{ country.name }}
          </td>
          <td>
            {{ country.capital }}
          </td>
          <td>
            <span class="badge bg-primary text-white">
              {{ country.population | number }}
            </span>
          </td>
          <td>
            <a
              [routerLink]="['/country', country.code]"
              class="link-primary cursor pointer"
            >
              Más información
            </a>
          </td>
        </tr>
      }
    </tbody>
  </table>
</section>
