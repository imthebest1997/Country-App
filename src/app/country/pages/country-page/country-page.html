@if (countryResource.isLoading()) {
  <div class="text-3xl text-center">
    <p>Cargando...</p>
  </div>
} @else if (countryResource.error()) {
  <app-not-found [countryCode]="countryCode"/>
} @else if (countryResource.value()?.length === 0) {
  <app-not-found [countryCode]="countryCode"/>
} @else if(countryResource.hasValue()) {
  <country-information [country]="countryResource.value()[0]!"/>
}
